name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.4).

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Sync ALD tokens
        run: |
          mkdir -p packages/tokens/source
          if [ -d "${{ github.workspace }}/../ALD" ]; then
            cp -r ../ALD packages/tokens/source/ald
          else
            echo "ALD not in CI; using committed source/ald if present"
          fi

      - run: pnpm install --frozen-lockfile

      - name: Export icons from Figma
        run: pnpm icons:export
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - run: pnpm sync:ald || true
      - run: pnpm build
      - run: pnpm typecheck
