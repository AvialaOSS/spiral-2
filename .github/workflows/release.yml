name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write # changesets/action opens the version PR
  id-token: write # npm Trusted Publishing (OIDC)

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.4).
        # Do not also set `with.version` — action-setup@v4 treats that as a conflict.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        # Pin to 11.x: >=11.5.1 supports OIDC, while npm 12 turns the
        # `--no-git-checks` flag pnpm forwards into a fatal EUNKNOWNCONFIG.
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # No Figma export. Version PR path only runs `changeset version` (cheap).
      # Publish path builds from committed sources inside `release:publish`.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — authenticate via npm Trusted Publisher (OIDC).
          # Configure each package on npmjs.com → Settings → Trusted publishing.
