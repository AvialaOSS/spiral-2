name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write # npm Trusted Publishing (OIDC)

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.4).
        # Do not also set `with.version` — action-setup@v4 treats that as a conflict.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Export icons from Figma
        run: pnpm icons:export
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - run: pnpm --filter @aviala-design/tokens --filter @aviala-design/icons --filter @aviala-design/spiral build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — authenticate via npm Trusted Publisher (OIDC).
          # Configure each package on npmjs.com → Settings → Trusted publishing.
