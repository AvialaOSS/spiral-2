name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write # changesets/action opens the version PR
  id-token: write # npm Trusted Publishing (OIDC)

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager" (pnpm@9.15.4).
        # Do not also set `with.version` — action-setup@v4 treats that as a conflict.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        # Pin to 11.x: >=11.5.1 supports OIDC, while npm 12 turns the
        # `--no-git-checks` flag pnpm forwards into a fatal EUNKNOWNCONFIG.
        run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      # No Figma export. Version PR path only runs `changeset version` (cheap).
      # Publish path builds from committed sources inside `release:publish`.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:publish
          version: pnpm run version:packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — authenticate via npm Trusted Publisher (OIDC).
          # Configure each package on npmjs.com → Settings → Trusted publishing.

      # Cross-repo: notify avialaWebsite to open a docs-coverage PR.
      # GitHub App installed on avialaWebsite (Contents: R/W). Mint a short-lived
      # installation token — default GITHUB_TOKEN cannot dispatch other repos.
      # Spiral2 secrets/vars: AVIALA_WEBSITE_APP_CLIENT_ID + AVIALA_WEBSITE_APP_PRIVATE_KEY
      - name: Create token for avialaWebsite
        id: website-app
        if: steps.changesets.outputs.published == 'true' && vars.AVIALA_WEBSITE_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AVIALA_WEBSITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AVIALA_WEBSITE_APP_PRIVATE_KEY }}
          owner: AvialaOSS
          repositories: avialaWebsite

      - name: Warn if docs dispatch credentials missing or token failed
        if: >
          steps.changesets.outputs.published == 'true' &&
          (vars.AVIALA_WEBSITE_APP_CLIENT_ID == '' || steps.website-app.outcome != 'success')
        run: |
          echo "::warning::Docs scaffold dispatch skipped (set AVIALA_WEBSITE_APP_CLIENT_ID + AVIALA_WEBSITE_APP_PRIVATE_KEY). See https://github.com/AvialaOSS/avialaWebsite/blob/main/docs/SPIRAL_DOCS_DISPATCH.md"

      - name: Dispatch docs scaffold on avialaWebsite
        if: steps.changesets.outputs.published == 'true' && steps.website-app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.website-app.outputs.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          VERSION=$(node -e '
            const pkgs = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
            const spiral = pkgs.find((p) => p.name === "@aviala-design/spiral");
            if (!spiral) process.exit(2);
            process.stdout.write(spiral.version);
          ') || {
            echo "No @aviala-design/spiral in published packages; skip."
            exit 0
          }
          echo "Dispatching spiral-released for @aviala-design/spiral@$VERSION"
          gh api repos/AvialaOSS/avialaWebsite/dispatches \
            -f event_type='spiral-released' \
            -f "client_payload[spiral_version]=${VERSION}"
